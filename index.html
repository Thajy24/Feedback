<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedbacks</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --accent:#2563eb; --alert:#e11d48; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width:860px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:16px; margin:28px 0 10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:0 0 4px; }
  input, select, textarea, button { font:inherit; width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; margin-bottom:12px; }
  textarea { min-height:100px; resize:vertical; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.6; cursor:default; }
  button.ghost { background:none; color:var(--muted); width:auto; padding:0; margin:0; font-weight:400; text-decoration:underline; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px; }
  .muted { color:var(--muted); }
  .msg { min-height:20px; font-size:13px; margin:0; }
  .err { color:var(--alert); } .ok { color:#15803d; }
  #login { max-width:360px; margin:12vh auto 0; }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:13px; color:var(--muted); font-weight:600; }
  td.m { white-space:pre-wrap; min-width:220px; }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; white-space:nowrap; }
  .tag.unread { background:#ffe4e6; color:var(--alert); }
  .tag.read { background:#dcfce7; color:#15803d; }
  #agent { max-width:640px; }
  .fb { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; cursor:pointer; }
  .fb.unread { border-left:4px solid var(--alert); background:#fff1f2; }
  .fb .meta { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .fb .body { white-space:pre-wrap; }
  .reply { margin:8px 0 0 10px; padding-left:10px; border-left:3px solid var(--line); font-size:14px; white-space:pre-wrap; }
  .reply .meta { font-size:12px; color:var(--muted); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>

  <!-- CONNEXION -->
  <form id="login" class="card" hidden>
    <h1 id="loginTitle">Connexion</h1>
    <p class="muted" style="margin:0 0 16px">Accédez à votre espace feedbacks.</p>
    <div id="nomRow" hidden>
      <label for="nom">Nom complet</label>
      <input id="nom" type="text" autocomplete="name">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Mot de passe</label>
    <input id="password" type="password" autocomplete="current-password" minlength="6" required>
    <button id="loginBtn" type="submit">Se connecter</button>
    <p id="loginErr" class="msg err" role="alert"></p>
    <button type="button" id="modeBtn" class="ghost">Pas de compte ? Créer un compte</button>
  </form>

  <!-- ESPACE ADMIN -->
  <section id="admin" hidden>
    <div class="top">
      <div><h1>Espace admin</h1><span id="adminWho" class="muted"></span></div>
      <button class="ghost logout">Se déconnecter</button>
    </div>

    <h2>Ajouter un agent</h2>
    <form id="addForm" class="card">
      <label for="newNom">Nom complet</label>
      <input id="newNom" type="text" required>
      <label for="newEmail">Email</label>
      <input id="newEmail" type="email" required>
      <label for="newPass">Mot de passe (6 caractères minimum)</label>
      <input id="newPass" type="text" minlength="6" autocomplete="off" required>
      <button id="addBtn" type="submit">Créer l'agent</button>
      <p id="addMsg" class="msg" role="status"></p>
    </form>

    <div id="pendingBox" hidden>
      <h2>Agents</h2>
      <div id="pending" class="card"></div>
    </div>

    <h2>Envoyer un feedback</h2>
    <div class="card">
      <label for="target">Destinataire</label>
      <select id="target"></select>
      <label for="message">Message</label>
      <textarea id="message"></textarea>
      <button id="sendBtn">Envoyer le feedback</button>
      <div id="sendMsg" class="msg" role="status"></div>
    </div>

    <h2>Feedbacks envoyés</h2>
    <label for="filter">Filtrer par agent</label>
    <select id="filter"></select>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Date</th><th>Agent</th><th>Message</th><th>Statut</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <!-- ESPACE AGENT -->
  <section id="agent" hidden>
    <div class="top">
      <div><h1>Mes feedbacks</h1><span id="agentWho" class="muted"></span></div>
      <button class="ghost logout">Se déconnecter</button>
    </div>
    <div id="mine"></div>
  </section>

</main>

<script>
// À remplacer : Supabase > Project Settings > API (clé "anon" uniquement)
const SUPABASE_URL = "https://mzjiyusbgtslfzchoykf.supabase.co";
const SUPABASE_KEY = "sb_publishable_6JGumr_7n73O3U6MjRdgkw_5mZH46cc";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let uid = null, agents = [], timer = null;

function show(name) {
  ["login", "admin", "agent"].forEach(n => { $(n).hidden = n !== name; });
}
function option(value, text) {
  const o = document.createElement("option");
  o.value = value; o.textContent = text;
  return o;
}

/* ---------- Connexion et aiguillage selon le rôle ---------- */
async function route() {
  clearInterval(timer);
  document.title = "Feedbacks";
  const { data: { session } } = await db.auth.getSession();
  if (!session) return show("login");

  const { data: p } = await db.from("profiles").select("nom,role,actif").eq("id", session.user.id).single();
  if (!p) {
    await db.auth.signOut();
    show("login");
    $("loginErr").textContent = "Ce compte n'a pas de profil. Contactez l'administrateur.";
    return;
  }
  uid = session.user.id;

  if (p.role === "admin") {
    $("adminWho").textContent = p.nom;
    show("admin");
    await loadAgents();
    await loadPending();
    await loadHistory();
    timer = setInterval(() => { loadHistory(); loadPending(); }, 30000);
  } else if (!p.actif) {
    $("agentWho").textContent = p.nom;
    show("agent");
    $("mine").textContent = "Votre compte est en attente de validation par l'administrateur.";
    timer = setInterval(route, 30000);
  } else {
    $("agentWho").textContent = p.nom;
    show("agent");
    await loadMine();
    timer = setInterval(() => loadMine(true), 30000);
  }
}

let signup = false;
function setMode(on) {
  signup = on;
  $("nomRow").hidden = !on;
  $("nom").required = on;
  $("loginTitle").textContent = on ? "Créer un compte" : "Connexion";
  $("loginBtn").textContent = on ? "Créer mon compte" : "Se connecter";
  $("modeBtn").textContent = on ? "Déjà un compte ? Se connecter" : "Pas de compte ? Créer un compte";
  $("password").autocomplete = on ? "new-password" : "current-password";
  $("loginErr").textContent = "";
}
$("modeBtn").addEventListener("click", () => setMode(!signup));

$("login").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("loginErr");
  err.className = "msg err";
  err.textContent = "";
  $("loginBtn").disabled = true;
  const email = $("email").value.trim(), password = $("password").value;

  if (signup) {
    const r = await db.auth.signUp({ email, password, options: { data: { nom: $("nom").value.trim() } } });
    $("loginBtn").disabled = false;
    if (r.error) {
      err.textContent = /registered|already/i.test(r.error.message)
        ? "Cet email a déjà un compte."
        : "Création impossible : " + r.error.message;
      return;
    }
    if (!r.data.session) {
      setMode(false);
      err.className = "msg ok";
      err.textContent = "Compte créé. Confirmez votre email, puis connectez-vous.";
      return;
    }
  } else {
    const { error } = await db.auth.signInWithPassword({ email, password });
    $("loginBtn").disabled = false;
    if (error) { err.textContent = "Email ou mot de passe incorrect."; return; }
  }
  $("password").value = "";
  await route();
});

document.querySelectorAll(".logout").forEach(b => b.addEventListener("click", async () => {
  clearInterval(timer);
  await db.auth.signOut();
  show("login");
  document.title = "Feedbacks";
}));

/* ---------- Espace admin ---------- */
async function loadAgents() {
  const { data } = await db.from("profiles").select("id,nom").eq("role", "agent").eq("actif", true).order("nom");
  agents = data || [];
  $("target").replaceChildren(option("all", "Tous les agents"), ...agents.map(a => option(a.id, a.nom)));
  $("filter").replaceChildren(option("", "Tous les agents"), ...agents.map(a => option(a.id, a.nom)));
}

async function loadPending() {
  const { data } = await db.from("profiles").select("id,nom,actif").eq("role", "agent").order("actif").order("nom");
  const list = $("pending");
  list.replaceChildren();
  $("pendingBox").hidden = !data || !data.length;
  (data || []).forEach(p => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;flex-wrap:wrap";

    const left = document.createElement("div");
    left.style.cssText = "display:flex;gap:10px;align-items:center";
    const n = document.createElement("span");
    n.textContent = p.nom;
    const tag = document.createElement("span");
    tag.className = "tag " + (p.actif ? "read" : "unread");
    tag.textContent = p.actif ? "Actif" : "En attente";
    left.append(n, tag);

    const actions = document.createElement("div");
    actions.style.cssText = "display:flex;gap:8px";
    const small = "width:auto;margin:0;padding:6px 14px";

    if (!p.actif) {
      const ok = document.createElement("button");
      ok.textContent = "Activer";
      ok.style.cssText = small;
      ok.addEventListener("click", async () => {
        await db.from("profiles").update({ actif: true }).eq("id", p.id);
        await loadAgents();
        await loadPending();
      });
      actions.appendChild(ok);
    }

    const del = document.createElement("button");
    del.textContent = "Supprimer";
    del.style.cssText = small + ";background:var(--alert)";
    del.addEventListener("click", async () => {
      if (!confirm(`Supprimer ${p.nom} ?\nSon compte et tous ses feedbacks seront effacés définitivement.`)) return;
      del.disabled = true;
      const { error } = await db.rpc("delete_agent", { target: p.id });
      if (error) { alert("Suppression impossible : " + error.message); del.disabled = false; return; }
      await loadAgents();
      await loadPending();
      await loadHistory();
    });
    actions.appendChild(del);

    row.append(left, actions);
    list.appendChild(row);
  });
}

async function loadHistory() {
  let q = db.from("feedbacks")
    .select("id,message,lu,created_at,agent:profiles!feedbacks_agent_id_fkey(nom),reponses(id,message,created_at,lu_admin)")
    .order("created_at", { ascending: false }).limit(100);
  if ($("filter").value) q = q.eq("agent_id", $("filter").value);
  const { data, error } = await q;
  const tbody = $("rows");
  tbody.replaceChildren();
  if (error || !data.length) {
    const td = tbody.insertRow().insertCell();
    td.colSpan = 4;
    td.textContent = error ? "Impossible de charger les feedbacks." : "Aucun feedback envoyé pour le moment.";
    return;
  }
  let newReplies = 0;
  data.forEach(f => {
    const reps = (f.reponses || []).slice().sort((a, b) => a.created_at.localeCompare(b.created_at));
    const unreadReps = reps.filter(r => !r.lu_admin);
    newReplies += unreadReps.length;

    const tr = tbody.insertRow();
    tr.insertCell().textContent = new Date(f.created_at).toLocaleString("fr-FR");
    tr.insertCell().textContent = f.agent?.nom || "Inconnu";
    const m = tr.insertCell();
    m.className = "m";
    m.textContent = f.message;
    reps.forEach(r => {
      const d = document.createElement("div");
      d.className = "reply";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = "Réponse · " + new Date(r.created_at).toLocaleString("fr-FR");
      const txt = document.createElement("div");
      txt.textContent = r.message;
      d.append(meta, txt);
      m.appendChild(d);
    });

    const st = tr.insertCell();
    const t = document.createElement("span");
    t.className = "tag " + (f.lu ? "read" : "unread");
    t.textContent = f.lu ? "Lu" : "Non lu";
    st.appendChild(t);
    if (unreadReps.length) {
      const t2 = document.createElement("span");
      t2.className = "tag unread";
      t2.style.cssText = "display:inline-block;margin-top:4px";
      t2.textContent = "Nouvelle réponse";
      st.append(document.createElement("br"), t2);
      tr.style.cursor = "pointer";
      tr.title = "Cliquez pour marquer les réponses comme lues";
      tr.addEventListener("click", async () => {
        await db.from("reponses").update({ lu_admin: true }).eq("feedback_id", f.id).eq("lu_admin", false);
        await loadHistory();
      });
    }
  });
  document.title = newReplies ? `(${newReplies}) Espace admin` : "Feedbacks";
}

$("sendBtn").addEventListener("click", async () => {
  const message = $("message").value.trim();
  const out = $("sendMsg");
  out.className = "msg";
  if (!message) { out.className = "msg err"; out.textContent = "Écrivez un message avant d'envoyer."; return; }
  const ids = $("target").value === "all" ? agents.map(a => a.id) : [$("target").value];
  const { error } = await db.from("feedbacks").insert(ids.map(id => ({ agent_id: id, auteur_id: uid, message })));
  if (error) { out.className = "msg err"; out.textContent = "Échec de l'envoi : " + error.message; return; }
  $("message").value = "";
  out.className = "msg ok";
  out.textContent = ids.length > 1 ? `Feedback envoyé à ${ids.length} agents.` : "Feedback envoyé.";
  await loadHistory();
});

/* ---------- Ajout d'un agent par l'admin ---------- */
$("addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const out = $("addMsg");
  const fail = text => { out.className = "msg err"; out.textContent = text; $("addBtn").disabled = false; };
  out.className = "msg";
  out.textContent = "";
  $("addBtn").disabled = true;

  // Client temporaire sans session : la connexion de l'admin n'est pas touchée
  const tmp = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "tmp-signup" }
  });
  const nom = $("newNom").value.trim(), email = $("newEmail").value.trim();
  const { data, error } = await tmp.auth.signUp({ email, password: $("newPass").value, options: { data: { nom } } });

  if (error) {
    return fail(/registered|already/i.test(error.message) ? "Cet email a déjà un compte." : "Création impossible : " + error.message);
  }
  if (!data.user || (data.user.identities && data.user.identities.length === 0)) {
    return fail("Cet email a déjà un compte.");
  }
  const { error: upErr } = await db.from("profiles").update({ actif: true }).eq("id", data.user.id);
  if (upErr) return fail("Compte créé, mais l'activation a échoué : " + upErr.message);

  e.target.reset();
  out.className = "msg ok";
  out.textContent = `Agent créé et activé (${email}). Transmettez-lui son email et son mot de passe.`;
  $("addBtn").disabled = false;
  await loadAgents();
  await loadPending();
});

$("filter").addEventListener("change", loadHistory);

/* ---------- Espace agent ---------- */
async function loadMine(auto = false) {
  const list = $("mine");
  // Ne pas effacer une réponse en cours de saisie lors de l'actualisation automatique
  if (auto && [...list.querySelectorAll("textarea")].some(t => t.value.trim() || t === document.activeElement)) return;

  const { data, error } = await db.from("feedbacks").select("*,reponses(id,message,created_at)").eq("agent_id", uid)
    .order("created_at", { ascending: false }).limit(50);
  list.replaceChildren();
  if (error) { list.textContent = "Impossible de charger vos feedbacks."; return; }
  if (!data.length) { list.textContent = "Aucun feedback pour le moment."; return; }

  const unread = data.filter(f => !f.lu).length;
  document.title = unread ? `(${unread}) Mes feedbacks` : "Mes feedbacks";

  data.forEach(f => {
    const div = document.createElement("div");
    div.className = "fb" + (f.lu ? "" : " unread");
    div.tabIndex = 0;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = new Date(f.created_at).toLocaleString("fr-FR") + (f.lu ? "" : " · cliquez pour marquer comme lu");
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = f.message;
    div.append(meta, body);

    (f.reponses || []).slice().sort((a, b) => a.created_at.localeCompare(b.created_at)).forEach(r => {
      const d = document.createElement("div");
      d.className = "reply";
      const rm = document.createElement("div");
      rm.className = "meta";
      rm.textContent = "Votre réponse · " + new Date(r.created_at).toLocaleString("fr-FR");
      const rt = document.createElement("div");
      rt.textContent = r.message;
      d.append(rm, rt);
      div.appendChild(d);
    });

    // Zone de réponse
    const open = document.createElement("button");
    open.type = "button";
    open.className = "ghost";
    open.style.marginTop = "8px";
    open.textContent = "Répondre";
    const box = document.createElement("div");
    box.hidden = true;
    box.style.marginTop = "8px";
    const ta = document.createElement("textarea");
    ta.placeholder = "Votre réponse...";
    const send = document.createElement("button");
    send.type = "button";
    send.textContent = "Envoyer la réponse";
    box.append(ta, send);
    open.addEventListener("click", ev => { ev.stopPropagation(); box.hidden = !box.hidden; if (!box.hidden) ta.focus(); });
    box.addEventListener("click", ev => ev.stopPropagation());
    send.addEventListener("click", async ev => {
      ev.stopPropagation();
      const message = ta.value.trim();
      if (!message) return;
      send.disabled = true;
      const { error: err } = await db.from("reponses").insert({ feedback_id: f.id, auteur_id: uid, message });
      if (err) { alert("Envoi impossible : " + err.message); send.disabled = false; return; }
      ta.value = "";
      await loadMine();
    });
    div.append(open, box);

    if (!f.lu) {
      const markRead = async () => {
        await db.from("feedbacks").update({ lu: true }).eq("id", f.id);
        await loadMine();
      };
      div.addEventListener("click", markRead, { once: true });
      div.addEventListener("keydown", e => { if (e.target === div && e.key === "Enter") markRead(); });
    }
    list.appendChild(div);
  });
}

route();
</script>
</body>
</html>
